services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: freight
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://freight:freight@db:5432/freight
      BROKER_PASSWORD: ${BROKER_PASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-development-secret-change-me}
      ENV: ${ENV:-development}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
