services:
  - type: web
    name: kingoffreight
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    # Legacy: only read by the BOL-to-Postgres migration on first deploy of this version; safe to remove afterwards.
    disk:
      name: bol-uploads
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingoffreight-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BROKER_PASSWORD
        sync: false
      - key: BOOTSTRAP_USERNAME
        value: Keaster
      - key: ENV
        value: production
      # Legacy: only read by the BOL-to-Postgres migration on first deploy of this version; safe to remove afterwards.
      - key: UPLOAD_DIR
        value: /app/backend/data/uploads
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: KOF_SYNC_ENABLED
        value: "false"
      - key: KOF_USERNAME
        sync: false
      - key: KOF_PASSWORD
        sync: false
      - key: KOF_BASE_URL
        value: https://kingsoffreight.com/
      - key: KOF_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: KOF_FULL_SYNC_HOUR_UTC
        value: "8"

databases:
  - name: kingoffreight-db
    databaseName: kingoffreight
    user: freight
    plan: 0.1c-256mb

# Optional live-integration variables from backend/app/config.py:
# SMS_PROVIDER, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER
# EMAIL_PROVIDER, GRAPH_TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET, GRAPH_MAILBOX
# LLM_PROVIDER, ANTHROPIC_API_KEY, ANTHROPIC_MODEL
# FMCSA_PROVIDER, FMCSA_WEBKEY
